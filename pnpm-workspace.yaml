packages:
  - apps/*
  - packages/*
  - scripts/*

allowBuilds:
  '@parcel/watcher': false
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  bcrypt: true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: false

minimumReleaseAge: 10080

# Security overrides only; reasons and removal conditions in
# docs/adr/2026-11-07-pnpm-overrides-for-multer-and-deepmerge-ts.md
overrides:
  'multer@<2.5.0': ^2.5.0
  'deepmerge-ts@<8.0.0': ^8.0.2
