<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add coins mobile</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/9289bb8d20793fdaa54f2a398d1afa04">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="m cc" role="dialog" aria-modal="true" aria-labelledby="addm-h">
<header class="m-top" style="padding-left: 4px">
<button type="button" class="icon-btn" aria-label="Close"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path></svg></button>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.2">
<h1 id="addm-h" style="font-size: 16px; font-weight: 600">Add coins</h1>
<span style="font-size: 12px; color: #605d5d; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">to We Are Strong. We Are Together</span>
</div>
<button type="button" class="btn btn-primary btn-sm" style="margin-right: 6px">Done</button>
</header>
<div style="flex: none; padding: 12px 16px 10px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid rgba(32,31,29,0.16)">
<span class="searchbox"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.5"></circle><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path></svg><input class="input" type="search" aria-label="Search the catalog" value="10 Hryvnias"></span>
<div style="display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 0 16px">
<button type="button" class="chip" aria-pressed="true">Ukraine ▾</button>
<button type="button" class="chip" aria-pressed="false">Denomination ▾</button>
<button type="button" class="chip" aria-pressed="false">Year ▾</button>
<button type="button" class="chip" aria-pressed="false">Hide coins in this set</button>
</div>
</div>
<main class="m-body" style="padding: 0 0 20px; gap: 0">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
<div class="rrow" style="padding: 10px 16px">
<span class="coin gold sm" aria-hidden="true"><span class="n">10</span></span>
<div class="lname" style="position: relative"><sc-if value="{{r.eyebrow}}" hint-placeholder-val="{{ false }}"><span class="ccard-eyebrow">{{r.eyebrow}}</span></sc-if><a href="#" style="white-space: normal">{{r.title}}</a><small>{{r.sub}}</small>
<span class="badges"><sc-if value="{{r.inSet}}" hint-placeholder-val="{{ false }}"><span class="badge b-inset">In this set</span></sc-if><sc-if value="{{r.owned}}" hint-placeholder-val="{{ false }}"><span class="badge b-owned">✓ Owned</span></sc-if></span></div>
<sc-if value="{{r.canAdd}}" hint-placeholder-val="{{ true }}"><button type="button" class="icon-btn" style="border: 1px solid #bab6b6; background: #ffffff" onClick="{{r.add}}" aria-label="{{r.addLabel}}"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path></svg></button></sc-if>
<sc-if value="{{r.adding}}" hint-placeholder-val="{{ false }}"><span class="icon-btn" aria-label="Adding"><span class="check pending" style="position: static; width: 32px; height: 32px"><i></i></span></span></sc-if>
<sc-if value="{{r.justAdded}}" hint-placeholder-val="{{ false }}"><button type="button" class="icon-btn" style="background: #b68235; color: #ffffff" onClick="{{r.undo}}" aria-label="{{r.undoLabel}}"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button></sc-if>
<sc-if value="{{r.already}}" hint-placeholder-val="{{ false }}"><span style="width: 44px"></span></sc-if>
</div>
</sc-for>
</main>
<sc-if value="{{hasAdded}}" hint-placeholder-val="{{ false }}">
<div class="toast" role="status" style="position: absolute; bottom: 16px"><span>{{addedLabel}}</span><button type="button" class="tb">Done</button></div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { rows: [
      { id: 'a', eyebrow: '', title: '10 Hryvnias', sub: 'Ukraine · 2020', inSet: false, owned: true, st: 'idle' },
      { id: 'b', eyebrow: '', title: '10 Hryvnias', sub: 'Ukraine · 2021', inSet: false, owned: false, st: 'added' },
      { id: 'c', eyebrow: '', title: '10 Hryvnias', sub: 'Ukraine · 2022', inSet: false, owned: false, st: 'idle' },
      { id: 'd', eyebrow: 'We Are Strong. We Are Together', title: 'Donetsk Oblast', sub: 'Ukraine · 10 Hryvnias · 2025', inSet: true, owned: true, st: 'idle' },
      { id: 'e', eyebrow: 'We Are Strong. We Are Together', title: 'Odesa Oblast', sub: 'Ukraine · 10 Hryvnias · 2026', inSet: true, owned: true, st: 'idle' },
      { id: 'f', eyebrow: 'We Are Strong. We Are Together', title: 'Zaporizhzhia Oblast', sub: 'Ukraine · 10 Hryvnias · 2026', inSet: true, owned: false, st: 'idle' }
    ] };
  }
  renderVals() {
    var self = this;
    function set(id, f) { self.setState(function (s) { return { rows: s.rows.map(function (r) { return r.id === id ? Object.assign({}, r, f) : r; }) }; }); }
    var added = this.state.rows.filter(function (r) { return r.st === 'added'; }).length;
    return {
      rows: this.state.rows.map(function (r) {
        return {
          eyebrow: r.eyebrow, title: r.title, sub: r.sub, owned: r.owned, inSet: r.inSet,
          canAdd: !r.inSet && r.st === 'idle', adding: r.st === 'adding', justAdded: r.st === 'added', already: r.inSet,
          addLabel: 'Add ' + r.title + ' (' + r.sub + ') to this set', undoLabel: 'Added. Tap to undo adding ' + r.title,
          add: function () { set(r.id, { st: 'adding' }); setTimeout(function () { set(r.id, { st: 'added' }); }, 700); },
          undo: function () { set(r.id, { st: 'idle' }); }
        };
      }),
      hasAdded: added > 0,
      addedLabel: added + (added === 1 ? ' coin added to this set' : ' coins added to this set')
    };
  }
}
</script>
</body>
</html>
